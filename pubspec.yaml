name: flutter_theme_showcase
description: A Flutter theme showcase app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Clean Architecture dependencies
  bloc: ^8.1.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_liquid_glass: ^1.0.0+1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get_it: ^7.6.7
  google_fonts: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_test: ^9.1.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
