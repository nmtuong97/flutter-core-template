name: flutter_theme_showcase
description: A Flutter theme showcase app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  # Clean Architecture dependencies
  bloc: ^9.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_liquid_glass: ^1.0.0+1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.0.0
  get_it: ^9.0.0
  google_fonts: ^8.0.2
  injectable: ^2.3.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  provider: ^6.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  # Code generation dependencies
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
